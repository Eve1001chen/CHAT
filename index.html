<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優雅吐槽產生器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container py-5">
        <div class="text-center">
            <h1 class="mb-4">優雅吐槽產生器</h1>
            <div class="input-group mb-3 w-75 mx-auto">
                <input type="text" id="keywordInput" class="form-control" placeholder="輸入關鍵字（例如：作業、考試、報告）" aria-label="關鍵字">
            </div>
            <button id="generateBtn" class="btn btn-primary btn-lg mb-4">產生優雅吐槽</button>
            <div id="quote" class="quote-box p-4 mb-4"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
